<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>클립보드 덤프 — 장바구니 링크 샘플 뽑기</title>
<style>
  body { font: 15px/1.6 system-ui, "Malgun Gothic", sans-serif; max-width: 900px; margin: 24px auto; padding: 0 16px; color: #1a1a1a; }
  #box { border: 2px dashed #888; border-radius: 8px; padding: 28px; text-align: center; min-height: 60px; background: #fafafa; }
  #box:focus { outline: none; border-color: #2563eb; background: #eff6ff; }
  button { font: inherit; padding: 8px 14px; margin: 4px 6px 4px 0; cursor: pointer; }
  pre { background: #f3f4f6; padding: 12px; overflow: auto; max-height: 280px; white-space: pre-wrap; word-break: break-all; font-size: 12px; }
  .ok { color: #15803d; } .bad { color: #b91c1c; }
</style>
</head>
<body>
<h1>장바구니 링크 샘플 뽑기</h1>
<ol>
  <li>쇼핑몰 장바구니 페이지에서 <b>Ctrl+A → Ctrl+C</b></li>
  <li>아래 점선 칸을 클릭하고 <b>Ctrl+V</b></li>
  <li>찾은 링크 개수가 나오면 <b>[HTML 저장]</b>과 <b>[텍스트 저장]</b>을 눌러서 받은 파일을
      <code>specs/fixtures/carts/real/</code>에 <code>쇼핑몰이름-번호.html</code>, <code>쇼핑몰이름-번호.txt</code>로 넣기</li>
</ol>
<div id="box" tabindex="0" contenteditable="false">여기를 클릭하고 Ctrl+V</div>
<p id="summary"></p>
<div id="actions" hidden>
  <button id="saveHtml">HTML 저장</button>
  <button id="saveTxt">텍스트 저장</button>
</div>
<h3>찾은 링크 (글자 → 주소)</h3>
<pre id="links">(아직 없음)</pre>
<h3>text/html 앞부분</h3>
<pre id="htmlPreview">(아직 없음)</pre>
<script>
  let html = '', text = '';
  const $ = (id) => document.getElementById(id);
  const box = $('box');
  box.addEventListener('click', () => box.focus());
  document.addEventListener('paste', (e) => {
    e.preventDefault();
    const cd = e.clipboardData;
    html = cd.getData('text/html') || '';
    text = cd.getData('text/plain') || '';
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const anchors = [...doc.querySelectorAll('a[href]')]
      .map((a) => ({ t: a.textContent.replace(/\s+/g, ' ').trim(), h: a.getAttribute('href') }))
      .filter((x) => x.t && /^https?:/i.test(x.h));
    $('summary').innerHTML = html
      ? `<span class="ok">text/html 있음 (${html.length.toLocaleString()}자) · 글자가 있는 http 링크 ${anchors.length}개</span> · text/plain ${text.length.toLocaleString()}자`
      : `<span class="bad">text/html 없음 — 이 방법으로는 링크를 못 가져옴 (text/plain ${text.length.toLocaleString()}자)</span>`;
    $('links').textContent = anchors.length ? anchors.map((x) => `${x.t.slice(0, 60)}  →  ${x.h}`).join('\n') : '(없음)';
    $('htmlPreview').textContent = html ? html.slice(0, 3000) : '(없음)';
    $('actions').hidden = false;
  });
  const save = (name, content, type) => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([content], { type }));
    a.download = name; a.click();
  };
  $('saveHtml').onclick = () => save('clipboard.html', html, 'text/html;charset=utf-8');
  $('saveTxt').onclick = () => save('clipboard.txt', text, 'text/plain;charset=utf-8');
</script>
</body>
</html>
